# Builds and tests Nogenuity on Windows and Linux. It never runs on its own, to save Actions minutes:
# start it by hand (Actions -> Build -> Run workflow) or push a v* tag, which also creates a draft
# GitHub release with the binaries; publish it by hand after checking it.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  # Linux release binary: linked against glibc 2.31 (Ubuntu 20.04, Debian 11 and newer)
  ZIG_VERSION: "0.14.1"
  CARGO_ZIGBUILD_VERSION: "0.24.0"
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"
  # Oldest Fedora the .rpm is installed on as a check
  FEDORA_IMAGE: "fedora:44"
  # AppImage tools, checked against the SHA256 digests GitHub publishes for these release assets
  APPIMAGETOOL_URL: "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  APPIMAGE_RUNTIME_URL: "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
  APPIMAGE_RUNTIME_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
  GLIBC_TARGET: "2.31"
  CARGO_TERM_COLOR: always

jobs:
  # Cheap check first: a tag that doesn't match Cargo.toml fails before any build minute is spent
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION in Cargo.toml"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ env.RUST_VERSION }}-
      - name: Rust toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/nogenuity.exe dist/Nogenuity.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/Nogenuity.exe
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      # One architecture failing doesn't hide the result of the other
      fail-fast: false
      matrix:
        include:
          # zig_sha256: from https://ziglang.org/download/index.json
          - arch: x86_64
            runner: ubuntu-24.04
            zig_sha256: "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            zig_sha256: "f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      ZIG_SHA256: ${{ matrix.zig_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-zigbuild
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
            target
          key: linux-${{ matrix.arch }}-${{ env.RUST_VERSION }}-zigbuild${{ env.CARGO_ZIGBUILD_VERSION }}-deb${{ env.CARGO_DEB_VERSION }}-rpm${{ env.CARGO_GENERATE_RPM_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-${{ env.RUST_VERSION }}-zigbuild${{ env.CARGO_ZIGBUILD_VERSION }}-deb${{ env.CARGO_DEB_VERSION }}-rpm${{ env.CARGO_GENERATE_RPM_VERSION }}-
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev libxkbcommon-dev
      - name: Rust toolchain, Zig and cargo-zigbuild
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-$ARCH-linux-$ZIG_VERSION.tar.xz" -o zig.tar.xz
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1 && rm zig.tar.xz
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          # Cached between runs: only compiled the first time
          # `cargo zigbuild --version` is an error: only the binary itself takes that flag
          cargo-zigbuild --version 2>/dev/null | grep -qF "$CARGO_ZIGBUILD_VERSION" \
            || cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          cargo deb --version 2>/dev/null | grep -qF "$CARGO_DEB_VERSION"             || cargo install --locked cargo-deb --version "$CARGO_DEB_VERSION"
          cargo generate-rpm --version 2>/dev/null | grep -qF "$CARGO_GENERATE_RPM_VERSION" \
            || cargo install --locked cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION"
      - name: Test
        run: cargo test --locked
      - name: Build (glibc ${{ env.GLIBC_TARGET }})
        run: cargo zigbuild --release --locked --target "$TARGET.$GLIBC_TARGET"
      - name: Check the newest glibc symbol
        run: |
          set -o pipefail
          BIN="target/$TARGET/release/nogenuity"
          MAX=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Newest glibc symbol: $MAX"
          if [ -z "$MAX" ]; then
            echo "::error::No glibc symbols found in $BIN"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$MAX" "$GLIBC_TARGET" | sort -V | tail -1)" != "$GLIBC_TARGET" ]; then
            echo "::error::The binary needs glibc $MAX, newer than $GLIBC_TARGET"
            exit 1
          fi
      - name: Libraries resolve on Ubuntu 20.04 (glibc 2.31)
        run: |
          docker run --rm -v "$PWD/target/$TARGET/release/nogenuity:/nogenuity:ro" ubuntu:20.04 sh -ec '
            export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do
              apt-get update -qq >/dev/null && apt-get install -y -qq libfontconfig1 >/dev/null && break
              echo "apt failed (attempt $i), retrying"; sleep 10
            done
            dpkg -s libfontconfig1 >/dev/null || { echo "::error::Could not install libfontconfig1 in the container"; exit 1; }
            ldd /nogenuity
            ! ldd /nogenuity | grep -q "not found"'
      - name: Package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sh packaging/linux/package.sh "target/$TARGET/release/nogenuity" "$VERSION" "$ARCH" dist
          cargo deb --no-build --no-strip --target "$TARGET" --output dist
          sh packaging/linux/rpm.sh "$TARGET" dist
      - name: Check the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" "$FEDORA_IMAGE" sh -ec '
            RPM=$(ls /dist/*.rpm)
            rpm -qp --requires --recommends "$RPM"
            rpm -qp --scripts "$RPM" | grep -q "udevadm trigger"
            # The container skips documentation by default: the check wants it, to see it removed too
            for i in 1 2 3; do
              dnf install -y -q --setopt=tsflags= "$RPM" >/dev/null && break
              echo "dnf failed (attempt $i), retrying"; sleep 10
            done
            rpm -q nogenuity
            test -x /usr/bin/nogenuity
            test -f /usr/share/applications/nogenuity.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/nogenuity.png
            test -f /usr/share/icons/hicolor/scalable/apps/nogenuity.svg
            test -f /usr/share/alsa-card-profile/mixer/paths/nogenuity-alpha-s-game.conf
            test -f /usr/share/alsa-card-profile/mixer/profile-sets/nogenuity-alpha-s.conf
            test -f /usr/share/doc/nogenuity/README.md
            command -v pactl
            RULE=/usr/lib/udev/rules.d/70-nogenuity.rules
            grep -q "TAG+=\"uaccess\"" "$RULE"
            if grep -q ", GROUP=\"plugdev\"" "$RULE"; then echo "::error::plugdev in the rule"; exit 1; fi
            if ldd /usr/bin/nogenuity | grep "not found"; then echo "::error::Missing libraries"; exit 1; fi
            dnf remove -y -q nogenuity >/dev/null
            test ! -e /usr/bin/nogenuity
            test ! -e "$RULE"
            test ! -e /usr/share/doc/nogenuity'
      - name: AppImage
        if: matrix.arch == 'x86_64'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          T="$RUNNER_TEMP/appimage"; mkdir -p "$T"
          curl -sSfL "$APPIMAGETOOL_URL" -o "$T/appimagetool"
          curl -sSfL "$APPIMAGE_RUNTIME_URL" -o "$T/runtime"
          echo "$APPIMAGETOOL_SHA256  $T/appimagetool" | sha256sum -c -
          echo "$APPIMAGE_RUNTIME_SHA256  $T/runtime" | sha256sum -c -
          chmod +x "$T/appimagetool"
          sh packaging/linux/appimage.sh "target/$TARGET/release/nogenuity" "$VERSION" dist "$T/appimagetool" "$T/runtime"
      - name: Check the AppImage
        if: matrix.arch == 'x86_64'
        run: |
          IMG=$(ls dist/*.AppImage)
          chmod +x "$IMG"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$IMG" --appimage-extract >/dev/null)
          R="$RUNNER_TEMP/squashfs-root"
          test -x "$R/AppRun" && test -x "$R/usr/bin/nogenuity" && test -f "$R/nogenuity.desktop"
          ! grep -q '^TryExec=' "$R/nogenuity.desktop"
          ! ldd "$R/usr/bin/nogenuity" | grep -q "not found"
          echo "AppImage OK: $(du -h "$IMG" | cut -f1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    # Only for a pushed tag: a manual run on a tag rebuilds the artifacts without touching the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Nogenuity ${GITHUB_REF_NAME#v}" --generate-notes
